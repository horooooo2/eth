{id:2,cat:'虚拟币',time:'09:36',title:'比特币资金流向与市场波动，哪些信号值得跟踪？',summary:'将 ETF 相关消息、市场成交和大额账户动向分开呈现，帮助读者核对消息背景。',tags:['BTC','ETH'],important:true,sources:2,body:'这条示例用于展示虚拟币资讯详情。新闻报道、行情快照与巨鲸行为应分别注明采集时间，避免混为同一事件。',points:'可关联 BTC 与 ETH 的走势，同时保留原始新闻来源。示例不包含真实资金流入、流出或持仓结论。'},
{id:3,cat:'股票',time:'09:28',title:'存储产业链观察：需求预期与企业业绩线索',summary:'以西部数据为例，将行业需求、公司财报与相关标的集中展示，减少重复阅读同一事件的报道。',tags:['WDC'],important:false,sources:2,body:'不同媒体的报道可以合并到一个事件条目中，每个来源独立保留发布时间。后续出现新公告时，应作为事件进展更新。',points:'关注行业需求与公司实际披露之间的区别。这里的标题和文字均为界面示例，并非实际业绩报道。'},
{id:4,cat:'宏观',time:'09:15',title:'利率预期变化，如何影响科技股与数字资产？',summary:'从利率、流动性与风险偏好三个角度组织宏观信息，并展示可能相关的关注标的。',tags:['NVDA','BTC'],important:true,sources:4,body:'宏观事件不一定只对应一家公司。独立保留宏观分类，便于查看影响多个市场的背景信息。',points:'影响范围可以作为阅读线索，但不能替代对具体标的的判断。正式版将以可验证的公开数据和报道为依据。'},
{id:5,cat:'股票',time:'09:03',title:'算力产业链观察：订单、资本支出与产品更新',summary:'以英伟达及其产业链为例，展示科技股新闻如何连接公司、行业与市场背景。',tags:['NVDA'],important:false,sources:2,body:'一个事件可关联多个公司，阅读区应突出关联依据，例如客户关系、产品供应或行业需求。',points:'此处没有引用真实订单或收入数据。正式接入时，应优先展示公告和有明确来源的报道。'},
{id:6,cat:'商品',time:'08:54',title:'黄金与原油观察：利率、供需和避险需求',summary:'示例展示商品资讯如何独立分类，同时与跨市场宏观消息保持关联。',tags:['黄金','原油'],important:false,sources:2,body:'商品新闻可围绕库存、产量、需求和宏观环境展开，保留明确的时间与单位。',points:'该条目演示「全部动态」中不属于当前关注标的的内容，不代表真实市场事件。'}
];

const discussions=[
{id:101,cat:'股票',time:'09:40',title:'交付增长之外，我更关注汽车业务的毛利变化',summary:'交付量可以看增长速度，但盈利改善是否持续，还需要结合产品结构和后续财报。单月数字不足以说明全部。',tags:['HK1810'],author:'观察者 A',angle:'经营观察',parent:1},
{id:102,cat:'股票',time:'09:25',title:'存储需求回暖，是否已经反映在价格预期里？',summary:'我会把行业需求与公司的实际订单分开看。预期很热的时候，更需要核对财报里的兑现情况。',tags:['WDC'],author:'观察者 B',angle:'估值讨论',parent:3},
{id:103,cat:'虚拟币',time:'09:33',title:'资金流入与短期价格，并不总是同步',summary:'相比单日流入，我更关注持续性和成交深度。新闻可以提供线索，但不代表价格一定按同一方向变化。',tags:['BTC','ETH'],author:'观察者 C',angle:'资金观察',parent:2},
{id:104,cat:'股票',time:'09:00',title:'算力需求之外，也要留意客户的投入回报',summary:'资本开支增加是一个观察维度，客户能否持续投入，以及新产品交付节奏，同样值得跟踪。',tags:['NVDA'],author:'观察者 D',angle:'行业观察',parent:5},
{id:105,cat:'商品',time:'08:50',title:'看原油时，我会先区分短期事件和供需趋势',summary:'事件推动的波动与库存、产量变化不是同一件事，需要结合不同时间尺度阅读。',tags:['原油'],author:'观察者 E',angle:'供需讨论',parent:6},
{id:106,cat:'股票',time:'09:31',title:'新品发布很热闹，我想再看看需求能否持续',summary:'产品关注度和最终销量需要分开判断。我会等更完整的披露，再评估对公司业务的影响。',tags:['HK1810'],author:'观察者 F',angle:'不同视角',parent:1}
];
discussions.forEach(d=>news.push({...d,kind:'discussion',important:false,sources:1,body:d.summary,points:'这是虚构用户与虚构观点，仅演示公开讨论的呈现方式，没有引用任何平台的真实内容。'}));
function opinionBlock(n){const rows=discussions.filter(d=>d.id!==n.id&&d.tags.some(t=>n.tags.includes(t)));return `<div class="opinion-heading"><h3>相关市场讨论</h3><small>${rows.length} 条示例观点</small></div><p class="opinion-hint">围绕同一标的的公开讨论 · 非本文评论 · 不代表市场共识</p>${rows.map(d=>`<div class="opinion"><div class="opinion-author"><span class="opinion-avatar">${d.author.slice(-1)}</span><div>${d.author}<small>示例社区 · ${d.time} · 虚构用户</small></div></div><p>${d.summary}</p><div class="opinion-footer"><span class="opinion-tag">${d.angle}</span><button data-discussion="${d.id}">展开观点 ↗</button></div></div>`).join('')||'<p class="opinion-hint">该主题暂无更多示例讨论。</p>'}`}

const state={kind:'all',scope:'watch',cat:'全部',asset:'',search:'',important:false,sort:'time',selected:1,saved:new Set([3])};
function visibleRows(){return news.filter(n=>(state.kind==='all'||(n.kind||'news')===state.kind)&&(state.scope!=='saved'||state.saved.has(n.id))&&(state.scope!=='watch'||n.tags.some(t=>assets.some(a=>a.id===t)))&&(state.cat==='全部'||state.cat===n.cat)&&(!state.asset||n.tags.includes(state.asset))&&(!state.important||n.important)&&(!state.search||(n.title+n.summary+n.tags.join(' ')+n.tags.map(t=>assets.find(a=>a.id===t)?.name||'').join(' ')).toLowerCase().includes(state.search.toLowerCase()))).sort((a,b)=>state.sort==='important'?Number(b.important)-Number(a.important)||b.time.localeCompare(a.time):b.time.localeCompare(a.time))}
function renderTickers(){$('tickers').innerHTML=assets.map(a=>`<button class="ticker ${state.asset===a.id?'active':''}" data-asset="${a.id}" aria-pressed="${state.asset===a.id}" title="点击筛选 ${a.name} 动态，再次点击取消"><div class="ticker-top">${a.name}<small>${a.id}</small></div><div class="ticker-bottom">${a.price}<span class="${a.change.startsWith('+')?'up':'down'}">${a.change}</span></div></button>`).join('')}
function render(){document.querySelectorAll('[data-kind]').forEach(b=>{b.classList.toggle('active',b.dataset.kind===state.kind);b.setAttribute('aria-pressed',String(b.dataset.kind===state.kind))});const rows=visibleRows();if(!rows.some(n=>n.id===state.selected))state.selected=rows[0]?.id??null;document.querySelectorAll('[data-scope]').forEach(b=>{b.classList.toggle('active',b.dataset.scope===state.scope);b.setAttribute('aria-pressed',String(b.dataset.scope===state.scope))});document.querySelectorAll('[data-category]').forEach(b=>{b.classList.toggle('active',b.dataset.category===state.cat);b.setAttribute('aria-pressed',String(b.dataset.category===state.cat))});$('important').classList.toggle('active',state.important);$('important').setAttribute('aria-pressed',String(state.important));$('watch-count').textContent=news.filter(n=>n.tags.some(t=>assets.some(a=>a.id===t))).length;$('saved-count').textContent=state.saved.size;$('feed-count').textContent=`${rows.length} 条示例动态${state.asset?' · '+(assets.find(a=>a.id===state.asset)?.name||state.asset):''}`;$('news-list').innerHTML=rows.map(n=>`<article class="news-card ${n.kind==='discussion'?'discussion-card':''} ${n.id===state.selected?'selected':''}" data-news="${n.id}" tabindex="0" role="button" aria-label="阅读：${n.title}"><div class="news-meta"><span class="type-badge ${n.kind||''}">${icon(n.kind==='discussion'?'comment':'news')}${n.kind==='discussion'?'讨论':'新闻'}</span><span class="category">${n.cat}</span><span>${n.time} · 示例</span>${n.important?'<span class="important">重要</span>':''}</div><button class="bookmark ${state.saved.has(n.id)?'active':''}" data-save="${n.id}" aria-label="${state.saved.has(n.id)?'取消收藏':'收藏'}：${n.title}" aria-pressed="${state.saved.has(n.id)}">${icon('bookmark')}</button><h2>${n.title}</h2><p>${n.summary}</p><div class="news-bottom"><div class="tags">${n.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><span class="source-count">${n.kind==='discussion'?n.author+' · 示例社区':n.sources+' 个示例来源 · 已合并 ↗'}</span></div></article>`).join('')||'<div class="empty">没有符合条件的示例资讯<button id="reset-filters">清除筛选，查看全部</button></div>';renderTickers();renderReader()}
function renderReader(){const n=news.find(n=>n.id===state.selected);$('reader-column').classList.toggle('hidden',!n);if(!n)return;$('reader-body').innerHTML=`<div class="news-meta"><span class="type-badge ${n.kind||''}">${icon(n.kind==='discussion'?'comment':'news')}${n.kind==='discussion'?'讨论':'新闻'}</span><span class="category">${n.cat}</span><span>${n.time} · 模拟发布时间</span></div><h2>${n.title}</h2><div class="reader-summary">${n.summary}</div>${opinionBlock(n)}<div class="section-label">${n.kind==='discussion'?'个人观点 · 非新闻事实':'事件背景'}</div><p class="reader-text">${n.body}</p><p class="reader-text">${n.points}</p><div class="section-label">关联标的 <span style="color:#68778d;font-size:10px">/ 模拟行情</span></div>${n.tags.map(t=>{const a=assets.find(a=>a.id===t);return `<div class="asset-row"><span class="asset-logo">${a?.mark||t.slice(0,2)}</span><div class="asset-name">${a?.name||t}<small>${a?.id||'商品资产'}</small></div>${a?`<div class="asset-price">${a.price}<small class="${a.change.startsWith('+')?'up':'down'}">${a.change}</small></div>`:''}</div>`}).join('')}<div class="section-label">来源追踪 · ${n.sources} 个示例</div>${Array.from({length:n.sources},(_,i)=>`<div class="source-row"><span>示例来源 ${String.fromCharCode(65+i)} · ${n.time}</span><button data-source="${i}">查看说明 ↗</button></div>`).join('')}<div class="demo-note">本文为虚构设计文案，未引用真实报道。正式版将显示媒体名称、发布时间及可核验的原文链接。</div>`;$('save-detail').textContent=state.saved.has(n.id)?'已收藏 · 取消':'收藏这条资讯'}
let timer;function toast(text){$('toast').textContent=text;$('toast').classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.add('hidden'),2300)}function save(id){if(state.saved.has(id))state.saved.delete(id);else state.saved.add(id);render()}
let beforeModal;function modal(title,text){beforeModal=document.activeElement;$('modal-title').textContent=title;$('modal-text').textContent=text;$('modal-mask').classList.remove('hidden');$('modal-close').focus()}function closeModal(){$('modal-mask').classList.add('hidden');beforeModal?.focus()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b?.dataset.kind){state.kind=b.dataset.kind;render();return}if(b?.dataset.discussion){const d=discussions.find(d=>d.id===Number(b.dataset.discussion));modal(d.title,d.author+' · 示例社区 · 虚构观点。'+d.summary);return}if(b?.dataset.save){save(Number(b.dataset.save));return}if(b?.dataset.scope){state.scope=b.dataset.scope;render();return}if(b?.dataset.category){state.cat=b.dataset.category;render();return}if(b?.dataset.asset){state.asset=state.asset===b.dataset.asset?'':b.dataset.asset;render();return}if(b?.dataset.source!==undefined){modal('新闻来源说明','此处演示同一事件的多来源入口。当前未接入真实新闻，正式版将展示对应报道的原文链接，不会将示例内容作为真实消息发布。');return}if(b?.dataset.placeholder){toast(`${b.dataset.placeholder}为导航占位，此页专注新闻中心设计`);return}if(b?.id==='reset-filters'){Object.assign(state,{kind:'all',scope:'all',cat:'全部',asset:'',search:'',important:false});$('search').value='';render();return}const row=e.target.closest('[data-news]');if(row){state.selected=Number(row.dataset.news);render();$('reader-column').classList.add('open')}});
$('important').onclick=()=>{state.important=!state.important;render()};$('search').oninput=e=>{state.search=e.target.value;render()};$('sort').onchange=e=>{state.sort=e.target.value;render()};$('save-detail').onclick=()=>save(state.selected);$('close-reader').onclick=()=>$('reader-column').classList.remove('open');$('modal-close').onclick=closeModal;$('modal-mask').onclick=e=>{if(e.target===$('modal-mask'))closeModal()};document.addEventListener('keydown',e=>{if(!$('modal-mask').classList.contains('hidden')){if(e.key==='Escape')closeModal();if(e.key==='Tab'){e.preventDefault();$('modal-close').focus()}return}if(e.key==='Escape')$('reader-column').classList.remove('open');if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-news]')){e.preventDefault();e.target.click()}});render();
</script>
