<aside class="desktop-note"><div class="note-label">MOBILE / OCTOBER 2026</div><h2>最新手机版式</h2><p>沿用 PC 的<strong>深蓝灰与暖金色</strong>，为触屏重新组织操作层级。</p><p>顶部固定切换，内容独立滚动。<br>新闻列表 → 全屏阅读 → AI 讨论。<br>关注标的横向滑动，偏好在「我的」统一管理。</p><p>本页为独立 HTML 原型。所有行情、新闻与评论为模拟内容，不连接后端，不调用 AI。</p></aside>
<script>
const $=id=>document.getElementById(id);
const paths={chart:'<path d="M3 3v14h14M6 12l3-4 3 2 5-6"/>',radar:'<circle cx="10" cy="10" r="8"/><circle cx="10" cy="10" r="4"/><path d="m10 10 6-6"/>',news:'<rect x="3" y="2" width="14" height="16" rx="2"/><path d="M6 6h8M6 10h8M6 14h5"/>',settings:'<path d="M3 5h14M3 15h14"/><circle cx="7" cy="5" r="2"/><circle cx="13" cy="15" r="2"/>'};
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=`<svg class="icon" viewBox="0 0 20 20" aria-hidden="true">${paths[el.dataset.icon]}</svg>`);
const assets=[{id:'HK1810',name:'小米集团',mark:'mi',style:'mi',price:'35.62',change:'+3.28%'},{id:'WDC',name:'西部数据',mark:'WD',price:'67.84',change:'+4.72%'},{id:'NVDA',name:'英伟达',mark:'N',style:'nv',price:'128.46',change:'+2.86%'},{id:'BTC',name:'比特币',mark:'₿',style:'btc',price:'62,840.50',change:'+2.46%'},{id:'ETH',name:'以太坊',mark:'Ξ',price:'2,486.20',change:'−1.12%'},{id:'XAU',name:'黄金',mark:'Au',price:'2,648.30',change:'+0.85%'}];
const articles=[{id:1,asset:'HK1810',time:'09:42',title:'从产品热度到经营表现，小米有哪些值得跟踪的信号？',summary:'把新品关注度、交付节奏和正式财务披露分开观察，帮助梳理消息与经营表现的关系。',body:'这是新闻详情的模拟文案。手机版先展示消息摘要，再提供来源入口与 AI 讨论，避免一次堆叠太多信息。\n\n关注产品发布的同时，还可以结合需求持续性、业务结构和后续公告进行阅读。这里不包含真实财报数据或行情判断。'}, {id:2,asset:'WDC',time:'09:28',title:'存储产业链观察：需求变化与业绩兑现',summary:'区分行业预期和公司实际披露，跟踪需求、供给与产品结构。',body:'本条为虚构版式示例。正式接入时应保留原文来源和发布时间。'}, {id:3,asset:'BTC',time:'09:16',title:'数字资产市场观察：资金与价格的不同节奏',summary:'资金流向、市场成交和价格变化，分别提供不同维度的信息。',body:'本条为虚构版式示例，不包含真实资金流入流出结论。'}, {id:4,asset:'NVDA',time:'09:05',title:'算力产业链：资本投入之后，市场在关注什么？',summary:'从产品交付和客户需求观察产业变化，不把单一消息直接等同于价格趋势。',body:'本条仅演示关联标的新闻的阅读方式。'}, {id:5,asset:'XAU',time:'08:50',title:'黄金市场观察：利率预期与避险需求',summary:'关注宏观环境，也留意短期事件与长期因素之间的区别。',body:'本条仅为商品类新闻设计示例。'}];
const opinions=[{asset:'HK1810',author:'示例用户 A',time:'09:40',title:'交付之外，我更想看盈利改善能否持续',text:'产品关注度和实际经营表现需要分开看，后续财报中的产品结构会是我的观察重点。'}, {asset:'NVDA',author:'示例用户 B',time:'09:26',title:'资本开支增长，之后还要看投入回报',text:'公司业绩和客户持续投入的能力，可能比单次新闻更值得长期跟踪。'}, {asset:'WDC',author:'示例用户 C',time:'09:10',title:'行业预期很热，想再等一份实际数据',text:'我会把预期和兑现放在一起比较，而不只看一个方向的消息。'}];
const state={page:'crypto',sub:'alerts',trend:'short',kind:'news',asset:'',selected:'HK1810',interval:'1h',category:'',watch:assets.map(a=>a.id),draft:[],ai:true,article:null,scroll:{},chats:{}};
const mark=a=>`<span class="mark ${a.style||''}">${a.mark}</span>`;
const tone=a=>a.change.startsWith('−')?'down':'up';
function buttons(items,key,current,extra=""){return items.map(([id,label])=>`<button data-${key}="${id}" class="${extra} ${current===id?'active':''}" aria-pressed="${current===id}">${label}</button>`).join('')}
function newsChips(){return `<div class="chips"><button class="chip asset-chip ${!state.asset?'active':''}" data-asset="all" aria-pressed="${!state.asset}"><span class="mark">◎</span><span><b>综合资讯</b><small>市场快讯</small></span></button>${assets.filter(a=>state.watch.includes(a.id)).map(a=>`<button class="chip asset-chip ${state.asset===a.id?'active':''}" data-asset="${a.id}" aria-pressed="${state.asset===a.id}">${mark(a)}<span><b>${a.name}</b><small>${a.id}</small></span></button>`).join('')}</div>`}
function render(){
 document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===state.page);b.setAttribute('aria-current',b.dataset.page===state.page?'page':'false')});
 if(state.page==='news'){
  $('controls').innerHTML=`<div class="tabs">${buttons([['news','新闻'],['comments','评论']],'kind',state.kind)}</div>${newsChips()}`;
  const list=(state.kind==='news'?articles:opinions).filter(n=>state.watch.includes(n.asset)&&(!state.asset||n.asset===state.asset));
  $('content').innerHTML=`<div class="brief"><span>${state.asset?assets.find(a=>a.id===state.asset).name:'关注标的'} · ${list.length} 条示例</span><span>时间为演示</span></div>`+(list.map(n=>state.kind==='news'?`<button class="card article" data-article="${n.id}"><div class="meta"><span class="tag">新闻</span><span>示例来源</span><time>${n.time}</time></div><h2>${n.title}</h2><p>${n.summary}</p><div class="article-bottom"><b>${assets.find(a=>a.id===n.asset).name} · ${n.asset}</b><span>阅读详情 ↗</span></div></button>`:`<article class="card comment"><div class="author"><span>${n.author}</span><small>${n.time} · 虚构讨论</small></div><h2>${n.title}</h2><p>${n.text}</p><div class="article-bottom"><span class="tag purple">${n.asset}</span><button data-action="source">查看原帖 ↗</button></div></article>`).join('')||'<div class="empty">暂无匹配的示例内容</div>');
 }else if(state.page==='radar'){
  $('controls').innerHTML=`<div class="tabs">${buttons([['short','短期趋势'],['long','长期趋势']],'trend',state.trend)}</div><div class="chips">${state.trend==='short'?buttons([['5m','5 分钟'],['1h','1 小时'],['24h','24 小时']],'interval',state.interval,'chip'):[['股票','股票'],['指数','指数'],['金属 / 能源','金属 / 能源']].map(([id,label])=>`<button class="chip ${state.category===id?'active':''}" data-category="${id}">${label}</button>`).join('')}</div>`;
  const a=assets.find(a=>a.id===state.selected);
  $('content').innerHTML=`<div class="section-head"><h2>我的关注</h2><small>${state.trend==='long'?'默认 90 天':'按区间涨跌幅'} · 示例</small></div><div class="watch-grid">${assets.map(a=>`<button class="watch ${state.selected===a.id?'selected':''}" data-select="${a.id}"><div class="watch-top"><b>${a.name}</b><small>${a.id}</small></div><div class="watch-bottom"><span>${a.price}</span><span class="${tone(a)}">${a.change}</span></div></button>`).join('')}</div><div class="chart-card"><div class="chart-head"><b>${a.name} <span class="${tone(a)}">${a.change}</span></b><small>${state.trend==='long'?'日线 · 90 天':state.interval+' · K线'}</small></div><div class="chart-range"><span>区间最高 ${(Number(a.price.replaceAll(',',''))*1.08).toFixed(2)}</span><span>区间最低 ${(Number(a.price.replaceAll(',',''))*.92).toFixed(2)}</span><span>模拟</span></div><svg id="candles" class="chart" viewBox="0 0 360 170" role="img" aria-label="模拟K线走势"></svg><div class="chart-axis"><span>${state.trend==='long'?'07/12':'08:00'}</span><span>${state.trend==='long'?'08/25':'12:00'}</span><span>${state.trend==='long'?'10/09':'16:00'}</span></div></div><div class="section-head"><h2>合约列表</h2><button class="subtle" data-action="sort">涨跌幅排序 ⇅</button></div>${assets.filter(a=>state.trend==='short'||!state.category||(state.category==='股票'?['HK1810','WDC','NVDA'].includes(a.id):state.category==='金属 / 能源'?a.id==='XAU':false)).map(a=>`<div class="row">${mark(a)}<button class="name" data-select="${a.id}" style="text-align:left"><b>${a.name}</b><small>${a.id}USDT</small></button><div class="value ${tone(a)}">${a.change}<small>${a.price}</small></div><button class="round-action" data-action="source" aria-label="查看${a.name}详情">↗</button></div>`).join('')}`;drawChart();
 }else if(state.page==='crypto'){
  $('controls').innerHTML='';$('content').innerHTML=`<div class="quote"><div class="quote-top"><span>BTC / USDT</span><span class="subtle">模拟行情</span></div><div class="price">62,840.50</div><div class="quote-foot"><span class="up">+2.46%</span><span class="subtle">24 小时涨跌幅</span></div><svg class="spark" viewBox="0 0 340 65" aria-label="模拟价格走势"><path d="M0 54 17 49 31 53 46 37 64 42 80 30 96 34 114 21 130 32 145 26 163 29 180 13 194 19 211 8 229 19 245 13 260 22 278 8 296 14 315 3 340 8" fill="none" stroke="#53c6a3" stroke-width="2"/></svg></div><div class="section-head"><div class="tabs" style="margin:0;border:0">${buttons([['alerts','异动记录'],['whales','巨鲸账户']],'sub',state.sub)}</div><small>模拟数据</small></div><div class="chips"><button class="chip active" data-action="coin-filter">全部币种 ⌄</button><button class="chip" data-action="amount-filter">金额筛选 ⌄</button></div>${state.sub==='alerts'?[['BTC','看多','开仓','248.6 万','09:42'],['ETH','看空','加仓','86.2 万','09:35'],['BTC','看多','减仓','52.8 万','09:20']].map((a,i)=>`<div class="card"><div class="meta"><b style="color:var(--text)">${a[0]}</b><span class="${i===1?'down':'up'}">${a[1]} · ${a[2]}</span><time>${a[4]}</time></div><div class="row" style="border:0;padding-bottom:0"><span class="name"><b>示例账户 ${i+1}</b><small>模拟成交记录</small></span><span class="value">${a[3]}<small>USDT</small></span></div></div>`).join(''):[['示例账户 A','182.4 万','+12.80%'],['示例账户 B','98.6 万','+6.32%'],['示例账户 C','64.2 万','−2.17%']].map(a=>`<button class="row" style="width:100%;text-align:left" data-action="whale"><span class="mark">W</span><span class="name"><b>${a[0]}</b><small>账户权益 ${a[1]} USDT</small></span><span class="value ${a[2].startsWith('+')?'up':'down'}">${a[2]}<small>示例浮动盈亏</small></span></button>`).join('')}`;
 }else{
  $('controls').innerHTML='';$('content').innerHTML=`<div class="profile"><div class="profile-mark">M</div><div><b>我的</b><small>手机版设计预览</small></div></div><div class="card"><button class="switch-row" data-action="watch"><span>新闻标的管理<small>新闻与评论共用关注列表</small></span><span>${state.watch.length} 个 ›</span></button><button class="switch-row" data-action="preferences"><span>币种与合约偏好<small>管理虚拟币、短期与长期趋势</small></span><span>›</span></button><button class="switch-row" data-action="ai"><span>AI 分析设置<small>预览配置密钥后的对话入口</small></span><span>${state.ai?'已开启演示':'未配置'} ›</span></button><button class="switch-row" data-action="storage"><span>对话记录<small>正式版按账户与新闻保留 7 天</small></span><span>›</span></button></div><p class="subtle">此页面没有连接账户或数据库，设置仅在本次预览中生效。</p>`;
 }
}
function drawChart(){const svg=$('candles');if(!svg)return;let html=[30,70,110,150].map(y=>`<path d="M0 ${y}H360" stroke="#242c39" stroke-width=".6"/>`).join('');for(let i=0;i<38;i++){const mid=115-i*1.7+Math.sin(i*.56)*22,open=mid+Math.sin(i*1.8)*7,close=mid+Math.cos(i*1.2)*8,color=close<open?'#53c6a3':'#ed8090';html+=`<path d="M${i*9+8} ${Math.min(open,close)-7}V${Math.max(open,close)+8}" stroke="${color}"/><rect x="${i*9+5}" y="${Math.min(open,close)}" width="6" height="${Math.max(2,Math.abs(open-close))}" fill="${color}"/>`}svg.innerHTML=html}
function openArticle(id){state.article=id;const n=articles.find(n=>n.id===id);$('reader').innerHTML=`<div class="reader-bar"><button data-action="back" aria-label="返回新闻列表">‹</button><span>新闻详情</span><span class="demo">模拟内容</span></div><div class="reader-scroll"><div class="meta"><span class="tag">${n.asset}</span><span>示例来源</span><time>${n.time}</time></div><h1>${n.title}</h1><p class="lead">${n.summary}</p><p class="reader-body" style="white-space:pre-line">${n.body}</p><button class="subtle" data-action="source" style="color:var(--gold)">阅读来源原文 ↗</button>${state.ai?`<section class="ai"><div class="ai-heading"><b>与 AI 讨论行情</b><small>对话界面演示</small></div><p>结合当前新闻与 ${n.asset} 行情</p><div class="ai-history" id="ai-history"></div><form id="chat-form"><textarea aria-label="讨论问题" id="question" rows="3" maxlength="500" placeholder="这条消息有哪些值得继续关注的因素？"></textarea><div class="ai-actions"><span>演示回复 · 不调用模型</span><button class="primary" type="submit">发送</button></div></form></section>`:''}<div class="section-head"><h2>相关评论</h2><button data-action="related" class="subtle">查看讨论 →</button></div><p class="subtle">评论与新闻事实分别展示，保留作者与来源。</p></div>`;$('reader').classList.remove('hidden');$('reader').querySelector('[data-action=back]').focus();renderChat();}
function renderChat(){const el=$('ai-history');if(!el)return;el.replaceChildren();(state.chats[state.article]||[]).forEach(m=>{const d=document.createElement('div');d.className='bubble '+m.role;d.textContent=m.text;el.append(d)});el.scrollTop=el.scrollHeight;}
let beforeSheet;
function sheet(title,html){beforeSheet=document.activeElement;$('sheet-title').textContent=title;$('sheet-body').innerHTML=html;$('overlay').classList.remove('hidden');$('overlay').querySelector('[data-action=close-sheet]').focus()}
function closeSheet(){$('overlay').classList.add('hidden');beforeSheet?.focus()}
let toastTimer;function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2500)}
function watchSheet(){state.draft=[...state.watch];sheet('新闻标的管理',`<p>独立管理新闻与评论的关注标的。此处仅调整设计稿。</p>${assets.map(a=>`<button class="pick" data-pick="${a.id}" aria-pressed="${state.draft.includes(a.id)}"><span>${a.name} · ${a.id}</span><span>${state.draft.includes(a.id)?'✓':'＋'}</span></button>`).join('')}<div class="sheet-footer"><button data-action="close-sheet">取消</button><button class="primary" data-action="save-watch">保存</button></div>`)}
function navigate(page){state.scroll[state.page]=$('content').scrollTop;state.page=page;render();$('content').scrollTop=state.scroll[page]||0}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.page){navigate(b.dataset.page);return}for(const key of ['kind','trend','sub','interval']){if(b.dataset[key]){state[key]=b.dataset[key];render();$('content').scrollTop=0;return}}
 if(b.dataset.asset){state.asset=b.dataset.asset==='all'||state.asset===b.dataset.asset?'':b.dataset.asset;const x=$('controls').querySelector('.chips').scrollLeft;render();$('controls').querySelector('.chips').scrollLeft=x;$('content').scrollTop=0;return}
 if(b.dataset.category){state.category=state.category===b.dataset.category?'':b.dataset.category;render();return}
 if(b.dataset.select){state.selected=b.dataset.select;render();return}
 if(b.dataset.article){openArticle(Number(b.dataset.article));return}
 if(b.dataset.pick){const id=b.dataset.pick;state.draft=state.draft.includes(id)?state.draft.filter(x=>x!==id):[...state.draft,id];b.setAttribute('aria-pressed',String(state.draft.includes(id)));b.lastElementChild.textContent=state.draft.includes(id)?'✓':'＋';return}
 const a=b.dataset.action;
 if(a==='settings')navigate('settings');
 else if(a==='back'){$('reader').classList.add('hidden');document.querySelector(`[data-article="${state.article}"]`)?.focus()}
 else if(a==='related'){state.asset=articles.find(n=>n.id===state.article).asset;state.kind='comments';$('reader').classList.add('hidden');navigate('news')}
 else if(a==='watch')watchSheet();
 else if(a==='save-watch'){state.watch=[...state.draft];if(!state.watch.includes(state.asset))state.asset='';closeSheet();render();toast('已更新本次预览的新闻标的')}
 else if(a==='close-sheet')closeSheet();
 else if(a==='ai')sheet('AI 分析设置',`<p>此原型不收集 API 密钥。你可以切换已配置状态，预览新闻详情下的 AI 对话框。</p><button class="pick" data-action="toggle-ai"><span>模拟已配置 API</span><span>${state.ai?'✓':'关闭'}</span></button>`);
 else if(a==='toggle-ai'){state.ai=!state.ai;closeSheet();render();toast(state.ai?'已开启 AI 对话演示':'已隐藏 AI 对话入口')}
 else if(a==='storage')sheet('对话记录', '<p>正式版：当前浏览器保存 7 天，按账户、标的和新闻隔离。</p><p>此设计稿：仅临时演示，刷新即清空，不保存真实对话。</p>');
 else if(a==='source')toast('设计稿未连接真实来源，正式版将打开对应原文');
 else if(a==='sort')sheet('排序方式','<button class="pick" data-action="sort-demo">涨跌幅从高到低 <span>↓</span></button><button class="pick" data-action="sort-demo">涨跌幅从低到高 <span>↑</span></button><button class="pick" data-action="sort-demo">重置排序 <span>↺</span></button>');
 else if(a==='sort-demo'){closeSheet();toast('排序交互示意，示例行情保持不变')}
 else if(a==='preferences')sheet('币种与合约偏好','<p>正式版在此分别管理虚拟币、短期趋势与长期趋势。新闻可使用独立关注列表。</p>');
 else if(a==='whale')sheet('示例巨鲸账户','<p>账户权益、持仓和成交明细将在这里展示。本设计稿没有读取真实账户。</p>');
 else if(a==='coin-filter'||a==='amount-filter')sheet(a==='coin-filter'?'币种筛选':'金额筛选','<p>筛选交互占位，正式接入时复用当前 PC 端条件。</p>');
});
document.addEventListener('submit',e=>{if(e.target.id!=='chat-form')return;e.preventDefault();const text=$('question').value.trim();if(!text)return;const rows=state.chats[state.article]||=[];if(rows.length>=20){toast('此原型最多演示 10 轮对话');return}rows.push({role:'user',text},{role:'assistant',text:'【模拟回复】可以从消息来源、业务影响和市场预期三个角度继续核对。这是界面演示文案，未调用 AI，也未分析真实行情。'});$('question').value='';renderChat()});
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeSheet()});
document.addEventListener('keydown',e=>{if(!$('overlay').classList.contains('hidden')){if(e.key==='Escape')closeSheet();if(e.key==='Tab'){const items=[...$('overlay').querySelectorAll('button,input,textarea,a[href]')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}else if(e.key==='Escape')$('reader').classList.add('hidden')});
render();
</script>
</body>
</html>
