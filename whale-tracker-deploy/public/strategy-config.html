<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>策略配置</title>
  <style>
    :root {
      --bg: #0c1118;
      --panel: #151c26;
      --panel2: #1b2430;
      --line: #2a3544;
      --text: #eef3f8;
      --muted: #8fa0b3;
      --accent: #4aa3ff;
      --ok: #3dce8e;
      --warn: #e6a23c;
      --danger: #f56c6c;
      --chip: #243041;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .top {
      position: sticky; top: 0; z-index: 30;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(21,28,38,.94);
    }
    .top-left { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .top h1 { margin: 0; font-size: 1.15rem; font-weight: 650; }
    .nav a {
      color: var(--muted); text-decoration: none; font-size: .9rem; margin-right: 14px;
    }
    .nav a.on { color: var(--accent); font-weight: 700; }
    a.btn, button {
      appearance: none; border: 0; border-radius: 8px;
      padding: 8px 14px; background: var(--accent); color: #fff;
      font-size: 0.88rem; cursor: pointer; text-decoration: none;
    }
    button.ghost, a.ghost { background: var(--chip); color: var(--text); }
    button.sm { padding: 4px 10px; font-size: .78rem; border-radius: 6px; }
    input {
      background: #0f1520; color: var(--text);
      border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
    }
    main { max-width: 1400px; margin: 0 auto; padding: 16px 20px 40px; }
    .banner {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 16px;
      background: var(--panel);
    }
      .banner-stats {
      display: grid;
      grid-template-columns: repeat(7, minmax(72px, 1fr));
      gap: 8px;
    }
    .bstat {
      background: rgba(0,0,0,.18);
      border: 1px solid rgba(42,53,68,.8);
      border-radius: 10px;
      padding: 8px 10px;
      text-align: center;
    }
    .bstat .n { font-size: 1.2rem; font-weight: 700; }
    .bstat .l { color: var(--muted); font-size: .72rem; margin-top: 2px; }
    .layout { display: grid; grid-template-columns: 240px 1fr; gap: 14px; min-height: 640px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card-head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.02);
    }
    .card-head h2 { margin: 0; font-size: 1rem; }
    .card-body { flex: 1; overflow: auto; }
    .sec-title { color: var(--muted); font-size: .72rem; padding: 10px 12px 4px; letter-spacing: .04em; }
    .nav-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; cursor: pointer; color: var(--text); font-size: .86rem;
    }
    .nav-item:hover { background: rgba(74,163,255,.06); }
    .nav-item.on { background: rgba(74,163,255,.12); color: #fff; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #6f8196; flex: 0 0 8px; }
    .dot.ok { background: var(--ok); }
    .dot.warn { background: var(--warn); }
    .dot.danger { background: var(--danger); }
    .dot.muted { background: #6f8196; }
    .pill, .badge {
      display: inline-block; background: var(--chip); color: var(--muted);
      border-radius: 999px; padding: 3px 9px; font-size: .75rem; margin: 0 4px 4px 0;
    }
    .badge.ok, .pill.ok { color: var(--ok); }
    .badge.warn, .pill.warn { color: var(--warn); }
    .badge.danger, .pill.danger { color: var(--danger); }
    button.badge.link { background: var(--chip); color: var(--accent); }
    .tabs { display: flex; border-bottom: 1px solid var(--line); }
    .tab {
      flex: 1; text-align: center; padding: 9px 8px; background: transparent;
      color: var(--muted); border-radius: 0; border-bottom: 2px solid transparent;
    }
    .tab.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
    .detail-head { padding: 16px 18px 8px; }
    .detail-head h2 { margin: 0 0 8px; font-size: 1.2rem; }
    .meta { color: var(--muted); font-size: .8rem; line-height: 1.7; }
    .meta b { color: var(--text); }
    .kv, .kv-block { padding: 6px 18px; font-size: .84rem; }
    .kv { display: flex; gap: 12px; }
    .k { color: var(--muted); min-width: 160px; }
    .v { color: var(--text); }
    .kv-k { color: var(--accent); margin: 8px 0 4px; }
    pre.json {
      margin: 0; padding: 14px 16px; overflow: auto;
      font-family: ui-monospace, Consolas, monospace;
      font-size: .78rem; line-height: 1.45; color: #d7e3f0;
      background: #0f1520; min-height: 280px;
    }
    pre.json[contenteditable="true"] { outline: 2px solid var(--danger); }
    table { width: 100%; border-collapse: collapse; font-size: .82rem; margin-top: 14px; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid rgba(42,53,68,.65); }
    th { background: #121922; color: var(--muted); }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover td { background: rgba(74,163,255,.05); }
    .empty { padding: 28px; text-align: center; color: var(--muted); }
    .err-panel {
      margin: 12px 16px; padding: 12px; border-radius: 10px;
      background: rgba(245,108,108,.12); border: 1px solid rgba(245,108,108,.35); color: #ffb4b4;
    }
    .warn-panel { background: rgba(230,162,60,.12); border-color: rgba(230,162,60,.4); color: #f0cf8a; }
    .err-code { font-weight: 700; margin-bottom: 4px; }
    h3 { margin: 16px 18px 6px; font-size: .92rem; color: var(--accent); }
    .toolbar { padding: 10px 14px; display: flex; justify-content: flex-end; }
    .toolbar[hidden] { display: none !important; }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .banner-stats { grid-template-columns: repeat(3, minmax(72px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="top-left">
      <h1>策略配置</h1>
      <nav class="nav">
        <a href="/data.html">数据库看板</a>
        <a class="on" href="/strategy-config.html">策略配置</a>
      </nav>
    </div>
    <a class="btn ghost" href="/">返回主站</a>
  </div>
  <main>
    <section class="banner">
      <div class="banner-stats" id="stats"></div>
    </section>
    <div class="layout">
      <aside class="card">
        <div class="card-head">
          <h2>导航</h2>
          <input id="search" placeholder="搜索 S1 / 趋势 / S5" style="width:100%;margin-top:8px" />
        </div>
        <div class="card-body" id="navList"></div>
      </aside>
      <section class="card">
        <div class="detail-head" id="detailHead">加载中…</div>
        <div class="tabs">
          <button class="tab on" data-tab="summary" type="button">概要</button>
          <button class="tab" data-tab="structured" type="button">结构化视图</button>
          <button class="tab" data-tab="raw" type="button">原始配置</button>
          <button class="tab" data-tab="effective" type="button">运行生效值</button>
        </div>
        <div class="toolbar" id="copyBar" hidden>
          <button class="ghost sm" id="copyBtn" type="button">复制 JSON</button>
        </div>
        <div class="card-body" id="detailBody"></div>
      </section>
    </div>
    <section class="card" style="margin-top:14px">
      <div class="card-head"><h2>Overview</h2></div>
      <div class="card-body">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>名称</th><th>类型</th><th>状态</th><th>周期</th>
              <th>Symbols</th><th>Demo Allowed</th><th>Live Allowed</th><th>Runtime</th><th>Config Sync</th>
            </tr>
          </thead>
          <tbody id="tableRows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/strategy-config.js"></script>
  <script>
    const view = window.StrategyConfigView;
    let listPayload = null;
    let current = null;
    let tab = 'summary';

    function dotClass(status) {
      const s = String(status || '');
      if (s === 'READY' || s === 'PRODUCTION') return 'ok';
      if (s === 'RESEARCH' || s === 'WARNING') return 'warn';
      if (s === 'INVALID' || s === 'BLOCKED') return 'danger';
      return 'muted';
    }

    function renderStats(ov) {
      const cells = [
        ['Alpha 策略', ov.alpha_count],
        ['已实现', ov.implemented_count],
        ['Research', ov.research_count],
        ['Demo Allowed', ov.demo_allowed_count],
        ['Live Allowed', ov.live_allowed_count],
        ['Live Permission', ov.live_permission ? 'ON' : 'OFF'],
        ['当前启用', ov.current_active],
      ];
      document.getElementById('stats').innerHTML = cells.map(([l, n]) =>
        `<div class="bstat"><div class="n">${view.escapeHtml(n)}</div><div class="l">${l}</div></div>`
      ).join('');
    }

    function renderNav(items) {
      const q = document.getElementById('search').value;
      const filtered = view.filterItems(items, q);
      const groups = view.classify(filtered);
      const block = (title, rows) => `<div class="sec-title">${title}</div>` + rows.map((it) => `
        <div class="nav-item ${current && current.id === it.id ? 'on' : ''}" data-id="${it.id}">
          <span class="dot ${dotClass(it.status)}"></span>
          <span>${it.id} ${view.escapeHtml(it.name)}</span>
          ${it.config_error ? '<span class="pill danger">CONFIG ERROR</span>' : ''}
        </div>`).join('');
      document.getElementById('navList').innerHTML =
        block('Alpha 策略', groups.alpha) + block('系统模块', groups.system);
      document.querySelectorAll('.nav-item').forEach((el) => {
        el.addEventListener('click', () => select(el.getAttribute('data-id')));
      });
    }

    function renderTable(items) {
      document.getElementById('tableRows').innerHTML = items.map((it) => `
        <tr class="clickable" data-id="${it.id}">
          <td>${it.id}</td>
          <td>${view.escapeHtml(it.name)}</td>
          <td>${it.type}</td>
          <td>${it.status}</td>
          <td>${it.timeframe || '—'}</td>
          <td>${(it.symbols || []).join(', ') || '—'}</td>
          <td>${it.demo_allowed ? 'YES' : 'NO'}</td>
          <td>${it.live_allowed ? 'YES' : 'NO'}</td>
          <td>${it.runtime_active ? 'ACTIVE' : 'OFF'}</td>
          <td>${it.config_error ? 'ERROR' : '—'}</td>
        </tr>`).join('');
      document.querySelectorAll('#tableRows tr').forEach((el) => {
        el.addEventListener('click', () => select(el.getAttribute('data-id')));
      });
    }

    function renderDetail() {
      if (!current) return;
      const rel = current.release || {};
      const sync = view.runtimeSyncLabel(current.runtime);
      const demo = rel.demo_allowed ? 'Demo Allowed YES' : 'Demo Allowed NO';
      const liveCap = rel.live_allowed ? 'Live Allowed YES' : 'Live Allowed NO';
      const livePerm = rel.live_permission ? 'Live Permission ON' : 'Live Permission OFF';
      document.getElementById('detailHead').innerHTML = `
        <h2>${current.id} · ${view.escapeHtml(current.name)}</h2>
        <div>
          <span class="pill ${rel.stage === 'RESEARCH' ? 'warn' : 'ok'}">${view.escapeHtml(rel.stage || current.status)}</span>
          <span class="pill ${rel.demo_allowed ? 'ok' : 'muted'}">${demo}</span>
          <span class="pill ${rel.live_allowed ? 'ok' : 'muted'}">${liveCap}</span>
          <span class="pill ${rel.live_permission ? 'ok' : 'muted'}">${livePerm}</span>
          ${!rel.implemented ? '<span class="pill warn">NOT IMPLEMENTED</span>' : ''}
        </div>
        <div class="meta">
          ${(current.market && current.market.instrument) || '—'} · ${(current.market && current.market.timeframe) || '—'}<br/>
          Config <b>${view.escapeHtml(current.source && current.source.config_path)}</b>
          · Schema <b>${view.escapeHtml(current.source && current.source.schema_version)}</b>
          · Hash <b>${view.escapeHtml((current.runtime && current.runtime.disk_config_hash || '').slice(0, 8))}…</b>
          · Runtime <b>${current.runtime && current.runtime.active ? 'ACTIVE' : (current.runtime && current.runtime.state) || 'OFFLINE'}</b>
          · Config Sync <b class="${sync.cls}">${sync.text}</b>
          · Modified <b>${view.escapeHtml((current.source && current.source.modified_at || '').replace('T', ' ').slice(0, 16))}</b>
          · Source <b>${view.escapeHtml(current.source && current.source.kind)}</b>
        </div>
      `;
      const copyBar = document.getElementById('copyBar');
      if (tab === 'summary') {
        copyBar.hidden = true;
        const d = current.display || {};
        const summary = current.summary_zh || d.summary_zh || '暂无概要';
        document.getElementById('detailBody').innerHTML = `
          <div class="body">
            <p>${view.escapeHtml(summary)}</p>
            ${current.entry_summary_zh || d.entry_summary_zh ? `<p>入场：${view.escapeHtml(current.entry_summary_zh || d.entry_summary_zh)}</p>` : ''}
            ${current.risk_summary_zh || d.risk_summary_zh ? `<p>风险：${view.escapeHtml(current.risk_summary_zh || d.risk_summary_zh)}</p>` : ''}
            ${current.exit_summary_zh || d.exit_summary_zh ? `<p>退出：${view.escapeHtml(current.exit_summary_zh || d.exit_summary_zh)}</p>` : ''}
          </div>`;
      } else if (tab === 'structured') {
        copyBar.hidden = true;
        document.getElementById('detailBody').innerHTML = view.renderStructured(current);
        document.querySelectorAll('[data-jump]').forEach((el) => {
          el.addEventListener('click', () => select(el.getAttribute('data-jump')));
        });
      } else {
        copyBar.hidden = false;
        const payload = tab === 'effective' ? current.effective_config : current.raw_config;
        const offline = tab === 'effective' && (!current.runtime || !current.runtime.online);
        document.getElementById('detailBody').innerHTML = offline
          ? '<div class="empty">Runtime: OFFLINE</div>'
          : `<pre class="json" id="jsonView" spellcheck="false">${view.escapeHtml(view.prettyJson(payload))}</pre>`;
        const pre = document.getElementById('jsonView');
        if (pre) {
          pre.setAttribute('contenteditable', 'false');
          pre.setAttribute('readonly', 'true');
        }
      }
    }

    async function select(id) {
      const res = await fetch('/api/admin/strategy-configs/' + encodeURIComponent(id), { cache: 'no-store' });
      current = await res.json();
      if (!res.ok) {
        current = {
          id,
          name: id,
          release: {},
          source: {},
          runtime: { online: false, state: 'OFFLINE' },
          error: (current.error || current),
        };
      }
      renderNav((listPayload && listPayload.items) || []);
      renderDetail();
    }

    document.querySelectorAll('.tab').forEach((el) => {
      el.addEventListener('click', () => {
        tab = el.getAttribute('data-tab');
        document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t === el));
        renderDetail();
      });
    });
    document.getElementById('search').addEventListener('input', () => {
      renderNav((listPayload && listPayload.items) || []);
    });
    document.getElementById('copyBtn').addEventListener('click', async () => {
      const payload = tab === 'effective' ? current && current.effective_config : current && current.raw_config;
      try {
        await navigator.clipboard.writeText(view.prettyJson(payload));
      } catch (_) {}
    });

    (async function boot() {
      const res = await fetch('/api/admin/strategy-configs', { cache: 'no-store' });
      listPayload = await res.json();
      renderStats(listPayload.overview || {});
      renderNav(listPayload.items || []);
      renderTable(listPayload.items || []);
      const first = ((listPayload.alpha || [])[0] || (listPayload.items || [])[0] || {}).id || 'S1';
      await select(first);
    })();
  </script>
</body>
</html>
