name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: whale-tracker-frontend/package-lock.json

      - name: Sync backend into deploy package
        run: node whale-tracker-backend/scripts/sync-deploy.js

      - name: Build frontend
        working-directory: whale-tracker-frontend
        run: |
          npm ci
          npm run build
          mkdir -p ../whale-tracker-deploy/public
          rm -rf ../whale-tracker-deploy/public/assets
          cp -r dist/* ../whale-tracker-deploy/public/

      - name: Pack deploy payload
        run: |
          set -e
          rm -rf .deploy-pack
          mkdir -p .deploy-pack
          tar -C whale-tracker-deploy -czf .deploy-pack/code.tgz \
            --exclude='./node_modules' \
            --exclude='./public' \
            --exclude='./data' \
            --exclude='./cache' \
            --exclude='./.env' \
            --exclude='./.git' \
            --exclude='./.env.*' \
            .
          tar -C whale-tracker-deploy/public -czf .deploy-pack/public.tgz .
          tar -C ai-trading-system-v41 -czf .deploy-pack/engine.tgz \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./.git' \
            --exclude='./data' \
            --exclude='./logs' \
            --exclude='./.venv' \
            --exclude='./.pytest_cache' \
            --exclude='./__pycache__' \
            --exclude='*/__pycache__' \
            --exclude='*.pyc' \
            .
          cp whale-tracker-backend/scripts/remote-deploy.sh .deploy-pack/remote-deploy.sh
          chmod +x .deploy-pack/remote-deploy.sh

          echo "===== LOCAL DEPLOY PACK ====="
          ls -lah .deploy-pack
          find .deploy-pack -maxdepth 1 -type f -print

          test -f .deploy-pack/code.tgz || { echo "ERROR: missing local code.tgz"; exit 31; }
          test -f .deploy-pack/public.tgz || { echo "ERROR: missing local public.tgz"; exit 32; }
          test -f .deploy-pack/engine.tgz || { echo "ERROR: missing local engine.tgz"; exit 33; }
          test -f .deploy-pack/remote-deploy.sh || { echo "ERROR: missing local remote-deploy.sh"; exit 34; }
          test -s .deploy-pack/engine.tgz || { echo "ERROR: empty engine.tgz"; exit 35; }
          test -s .deploy-pack/remote-deploy.sh || { echo "ERROR: empty remote-deploy.sh"; exit 36; }
          echo "LOCAL PACK OK"

      - name: Upload deploy payload
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Explicit files — avoid glob/strip nesting under /tmp/whale-deploy-pack/.deploy-pack/
          source: ".deploy-pack/code.tgz,.deploy-pack/public.tgz,.deploy-pack/engine.tgz,.deploy-pack/remote-deploy.sh"
          target: "/tmp/whale-deploy-pack"
          strip_components: 1
          overwrite: true
          rm: true

      - name: Install deps and restart
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            PACK=/tmp/whale-deploy-pack

            echo "===== REMOTE PACK ====="
            ls -lah "$PACK" || true
            find "$PACK" -maxdepth 3 -type f -print || true

            # Tolerate accidental nesting from older scp layouts
            if [ ! -f "$PACK/remote-deploy.sh" ] && [ -f "$PACK/.deploy-pack/remote-deploy.sh" ]; then
              echo "WARN: files nested under $PACK/.deploy-pack — flattening"
              mv "$PACK/.deploy-pack/"* "$PACK"/ || true
              rmdir "$PACK/.deploy-pack" 2>/dev/null || true
              ls -lah "$PACK" || true
            fi

            if [ ! -f "$PACK/remote-deploy.sh" ]; then
              echo "ERROR: missing remote-deploy.sh"
              echo "expected: $PACK/remote-deploy.sh"
              find /tmp -maxdepth 4 -name 'remote-deploy.sh' -print 2>/dev/null || true
              exit 21
            fi

            if [ ! -f "$PACK/engine.tgz" ]; then
              echo "ERROR: missing engine.tgz"
              echo "expected: $PACK/engine.tgz"
              find /tmp -maxdepth 4 -name 'engine.tgz' -print 2>/dev/null || true
              exit 22
            fi

            if [ ! -f "$PACK/code.tgz" ]; then
              echo "ERROR: missing code.tgz"
              exit 23
            fi

            if [ ! -f "$PACK/public.tgz" ]; then
              echo "ERROR: missing public.tgz"
              exit 24
            fi

            echo "REMOTE PACK OK"
            echo "remote-deploy.sh => $(ls -lah "$PACK/remote-deploy.sh")"
            echo "engine.tgz => $(ls -lah "$PACK/engine.tgz")"

            chmod +x "$PACK/remote-deploy.sh"

            # Trace remote deploy; keep Lighthouse PATH via login shell
            export PATH="/usr/local/lighthouse/softwares/nodejs/node/bin:/root/.local/bin:/root/bin:${PATH}"
            echo "===== RUN remote-deploy.sh (bash -x) ====="
            bash -x "$PACK/remote-deploy.sh" "$PACK"

  flip_execute_v1:
    if: contains(github.event.head_commit.message, '[stage3-execute]')
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Flip ENV to OKX_DEMO EXECUTE without autostart
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            ENGINE=/root/ai-trading-system-v41
            DEPLOY=/root/whale-tracker-deploy
            export PATH="/usr/local/lighthouse/softwares/nodejs/node/bin:/root/.local/bin:/root/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:${PATH}"

            upsert_env() {
              local file="$1" key="$2" val="$3"
              if grep -q "^${key}=" "$file" 2>/dev/null; then
                sed -i "s|^${key}=.*|${key}=${val}|" "$file"
              else
                echo "${key}=${val}" >> "$file"
              fi
            }

            print_safe_env() {
              local file="$1" label="$2"
              echo "==> non-secret ENV ($label)"
              grep -E '^(V41_ALPHA_EXECUTION|V41_ENGINE_EXECUTION_MODE|V41_LIVE_TRADING_ENABLED|V41_QA_LIVE_ENABLED|V41_MARKET_DATA_SOURCE|V41_ENGINE_AUTOSTART|V41_ENGINE_OWNER_USER_ID)=' "$file" | sed 's/\r$//' || true
            }

            if grep -qiE '^V41_LIVE_TRADING_ENABLED=(true|1|yes|on)' "$ENGINE/.env" "$DEPLOY/.env" 2>/dev/null; then
              echo "ERROR: live trading already enabled — abort flip"
              exit 51
            fi

            for FILE in "$ENGINE/.env" "$DEPLOY/.env"; do
              upsert_env "$FILE" V41_ALPHA_EXECUTION EXECUTE
              upsert_env "$FILE" V41_ENGINE_EXECUTION_MODE node_gateway
              upsert_env "$FILE" V41_ENGINE_AUTOSTART 0
              upsert_env "$FILE" V41_LIVE_TRADING_ENABLED false
              upsert_env "$FILE" V41_QA_LIVE_ENABLED false
              upsert_env "$FILE" V41_MARKET_DATA_SOURCE okx
              upsert_env "$FILE" V41_ENGINE_OWNER_USER_ID user_0ca100ec361b9b42
            done

            print_safe_env "$ENGINE/.env" "engine after flip"
            print_safe_env "$DEPLOY/.env" "node after flip"

            NODE_TOKEN=$(grep '^V41_ENGINE_INTERNAL_TOKEN=' "$DEPLOY/.env" | head -1 | cut -d= -f2- | tr -d '\r')
            NODE_TOKEN=${NODE_TOKEN:-dev-internal-token}

            echo "==> restart Python (AUTOSTART=0)"
            systemctl restart v41-engine
            py_ok=0
            for i in $(seq 1 20); do
              sleep 2
              if curl -sf --max-time 3 -H "X-Engine-Token: ${NODE_TOKEN}" http://127.0.0.1:8711/internal/v1/health >/dev/null; then
                echo "Python health 200 (attempt $i)"
                py_ok=1
                break
              fi
              echo "engine health not ready, attempt $i"
            done
            if [ "$py_ok" != "1" ]; then
              echo "ERROR: Python 8711 health failed after EXECUTE flip"
              journalctl -u v41-engine -n 80 --no-pager || true
              exit 7
            fi

            echo "==> restart Node"
            systemctl restart whale-tracker
            ok=0
            for i in $(seq 1 15); do
              sleep 2
              if curl -sf --max-time 3 http://127.0.0.1/api/health >/dev/null \
                && curl -sf --max-time 3 -H "X-Engine-Token: ${NODE_TOKEN}" http://127.0.0.1:8711/internal/v1/health >/dev/null; then
                echo "node + engine health 200 (attempt $i)"
                ok=1
                break
              fi
              echo "post-flip health not ready, attempt $i"
            done
            if [ "$ok" != "1" ]; then
              echo "ERROR: health failed after EXECUTE flip"
              journalctl -u whale-tracker -n 40 --no-pager || true
              journalctl -u v41-engine -n 40 --no-pager || true
              exit 7
            fi
            echo "==> EXECUTE flip finished (AUTOSTART still 0)"
