name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: whale-tracker-frontend/package-lock.json

      - name: Sync backend into deploy package
        run: node whale-tracker-backend/scripts/sync-deploy.js

      - name: Build frontend
        working-directory: whale-tracker-frontend
        run: |
          npm ci
          npm run build
          mkdir -p ../whale-tracker-deploy/public
          rm -rf ../whale-tracker-deploy/public/assets
          cp -r dist/* ../whale-tracker-deploy/public/

      - name: Pack deploy payload
        run: |
          set -e
          mkdir -p .deploy-pack
          tar -C whale-tracker-deploy -czf .deploy-pack/code.tgz \
            --exclude='./node_modules' \
            --exclude='./public' \
            --exclude='./data' \
            --exclude='./cache' \
            --exclude='./.env' \
            --exclude='./.git' \
            --exclude='./.env.*' \
            .
          tar -C whale-tracker-deploy/public -czf .deploy-pack/public.tgz .
          tar -C ai-trading-system-v41 -czf .deploy-pack/engine.tgz \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./.git' \
            --exclude='./data' \
            --exclude='./logs' \
            --exclude='./.pytest_cache' \
            --exclude='./__pycache__' \
            --exclude='*/__pycache__' \
            --exclude='*.pyc' \
            .
          # Also ship remote-deploy.sh at pack root for first-boot before extract
          cp whale-tracker-backend/scripts/remote-deploy.sh .deploy-pack/remote-deploy.sh
          chmod +x .deploy-pack/remote-deploy.sh
          test -s .deploy-pack/engine.tgz
          test -s .deploy-pack/code.tgz
          ls -lh .deploy-pack

      - name: Upload deploy payload
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: '.deploy-pack/*'
          target: '/tmp/whale-deploy-pack'
          strip_components: 1
          overwrite: true

      - name: Install deps and restart
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            PACK=/tmp/whale-deploy-pack
            test -f "$PACK/remote-deploy.sh"
            test -f "$PACK/engine.tgz"
            chmod +x "$PACK/remote-deploy.sh"
            bash "$PACK/remote-deploy.sh" "$PACK"
