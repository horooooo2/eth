[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emotion-backtest"
version = "1.0.1"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "pandas>=2", "pyarrow>=18", "matplotlib>=3.9", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
